name: Kuaishou Android Probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kuaishou-android-probe.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      video_url:
        description: Kuaishou share or short-video URL
        required: true
        default: https://v.kuaishou.com/7EsP76S3
      apk_url:
        description: Optional direct Kuaishou APK URL; leave blank to resolve current APK from Baidu Mobile
        required: false
        default: ""
      probe_seconds:
        description: Seconds to observe the app after opening the video
        required: true
        default: "75"

permissions:
  contents: read

jobs:
  probe:
    name: Probe Kuaishou app network
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download Kuaishou APK
        env:
          APK_URL: ${{ inputs.apk_url }}
          APK_OUT: kuaishou.apk
        run: |
          python3 -m pip install --quiet requests
          python3 .github/scripts/download_kuaishou_apk.py
          ls -lh kuaishou.apk
          shasum -a 256 kuaishou.apk

      - name: Run ARM64 Android probe
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PACKAGE_NAME: com.smile.gifmaker
          VIDEO_URL: ${{ inputs.video_url }}
          PROBE_SECONDS: ${{ inputs.probe_seconds }}
        with:
          api-level: 30
          target: default
          arch: arm64-v8a
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/kuaishou_android_probe.sh

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuaishou-android-probe-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
