name: Kuaishou Android Probe

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Kuaishou share or short-video URL
        required: true
        default: https://v.kuaishou.com/7EsP76S3
      apk_url:
        description: Optional APK URL; defaults to the tested Baidu package
        required: false
        default: https://gdown.baidu.com/appcenter/pkg/upload/b63d72769f6760d6928d0afe7142e4da?prodid=2&suffix=eyJiZF92aWQiOiJuSGNZcmo2M1BXMGRQSDZMblcwTFBqbmtuVzd4bkhtMW5kdFlnMURzbjd0WWcxRFluV1J2ckg2MVBqRHNuNiJ9&docid=5015887276
  push:
    paths:
      - .github/workflows/kuaishou-android-probe.yml
      - tools/kuaishou-android-probe.sh
      - tools/kuaishou-url-hook.js

permissions:
  contents: read

jobs:
  probe:
    name: Probe Kuaishou app traffic
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VIDEO_URL: ${{ github.event.inputs.video_url || 'https://v.kuaishou.com/7EsP76S3' }}
      APK_URL: ${{ github.event.inputs.apk_url || 'https://gdown.baidu.com/appcenter/pkg/upload/b63d72769f6760d6928d0afe7142e4da?prodid=2&suffix=eyJiZF92aWQiOiJuSGNZcmo2M1BXMGRQSDZMblcwTFBqbmtuVzd4bkhtMW5kdFlnMURzbjd0WWcxRFluV1J2ckg2MVBqRHNuNiJ9&docid=5015887276' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Kuaishou APK
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (Linux; Android 15; Pixel 9 Pro) AppleWebKit/537.36 Chrome/153 Mobile Safari/537.36' \
            -e 'https://mobile.baidu.com/' \
            "$APK_URL" -o kuaishou.apk
          test "$(stat -c %s kuaishou.apk)" -gt 100000000
          unzip -tq kuaishou.apk >/dev/null
          sha256sum kuaishou.apk
          file kuaishou.apk

      - name: Run Android probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          disable-animations: true
          script: bash tools/kuaishou-android-probe.sh "$VIDEO_URL" "$GITHUB_WORKSPACE/kuaishou.apk"

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuaishou-android-probe-${{ github.run_id }}
          path: artifacts/kuaishou-android-probe/
          if-no-files-found: warn
          retention-days: 7
