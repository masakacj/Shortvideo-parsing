name: Build Kwai ColdRain Bridge
on:
  workflow_dispatch:
  push:
    branches:
      - feature/kwai-coldrain-api-bridge
    paths:
      - 'ios/KwaiColdRainBridge/**'
      - '.github/workflows/kwai-coldrain.yml'
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS arm64 dylib
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist
          xcrun --sdk iphoneos clang -x objective-c -fobjc-arc -fblocks -O2 -Wall \
            -arch arm64 -miphoneos-version-min=14.0 -isysroot "$SDK" \
            -dynamiclib -install_name '@rpath/KwaiInterfaceBridge.dylib' \
            -framework Foundation -framework UIKit -framework Photos -framework CoreGraphics -framework AVFoundation \
            ios/KwaiColdRainBridge/KwaiInterfaceBridge.m \
            -o dist/KwaiInterfaceBridge.dylib
          file dist/KwaiInterfaceBridge.dylib
          shasum -a 256 dist/KwaiInterfaceBridge.dylib > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: KwaiInterfaceBridge-arm64
          path: dist/*

      - name: Publish stable GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="kwai-coldrain-run-$GH_RUN_ID"
          ASSET="KwaiColdRain-InterfaceBridge-v2.dylib"
          cp dist/KwaiInterfaceBridge.dylib "dist/$ASSET"
          if gh release view "$TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" --clobber -R "$GH_REPO"
          else
            gh release create "$TAG" "dist/$ASSET" \
              --repo "$GH_REPO" \
              --target "$GH_SHA" \
              --title "冷冷雨接口补丁 v2 · run $GH_RUN_ID" \
              --notes "iOS arm64 dylib. Source commit: $GH_SHA. Includes media validation and Photos 3302 fallback."
          fi
          gh release view "$TAG" -R "$GH_REPO" --json assets --jq '.assets[].name'

      - name: Sync GitHub download link to IPA center
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="kwai-coldrain-run-$GH_RUN_ID"
          ASSET="KwaiColdRain-InterfaceBridge-v2.dylib"
          HASH="$(shasum -a 256 dist/KwaiInterfaceBridge.dylib | cut -d' ' -f1)"
          PAYLOAD="$(printf '{"name":"%s","tag":"%s","sha256":"%s"}' "$ASSET" "$TAG" "$HASH")"
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 3 \
            -X POST "https://ipa.78175132.xyz/api/v1/dylibs/link" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "x-github-repository: $GH_REPO" \
            -H "x-github-run-id: $GH_RUN_ID" \
            -H "x-github-sha: $GH_SHA" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD"
