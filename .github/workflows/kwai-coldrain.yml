name: Build Kwai ColdRain Bridge
on:
  workflow_dispatch:
  push:
    branches:
      - feature/kwai-coldrain-api-bridge
    paths:
      - 'ios/KwaiColdRainBridge/**'
      - '.github/workflows/kwai-coldrain.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS arm64 dylib
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist
          xcrun --sdk iphoneos clang -x objective-c -fobjc-arc -fblocks -O2 -Wall \
            -arch arm64 -miphoneos-version-min=14.0 -isysroot "$SDK" \
            -dynamiclib -install_name '@rpath/KwaiInterfaceBridge.dylib' \
            -framework Foundation -framework UIKit -framework Photos -framework CoreGraphics \
            ios/KwaiColdRainBridge/KwaiInterfaceBridge.m \
            -o dist/KwaiInterfaceBridge.dylib
          file dist/KwaiInterfaceBridge.dylib
          shasum -a 256 dist/KwaiInterfaceBridge.dylib > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: KwaiInterfaceBridge-arm64
          path: dist/*

      - name: Publish dylib to download center
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 --retry-delay 2 \
            -X POST "https://ipa.78175132.xyz/api/v1/dylibs" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "x-github-repository: ${GH_REPO}" \
            -H "x-github-run-id: ${GH_RUN_ID}" \
            -H "x-github-sha: ${GH_SHA}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-dylib-name: KwaiColdRain-InterfaceBridge-v1.dylib" \
            --data-binary @dist/KwaiInterfaceBridge.dylib
